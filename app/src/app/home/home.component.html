<div class="d-flex min-vh-100">
  <!-- Sidebar -->
  <nav class="sidebar bg-dark text-white" [class.collapsed]="sidebarCollapsed">
    <!-- Logo -->
    <div class="sidebar-header p-3 border-bottom border-secondary">
      <div class="d-flex align-items-center">
        <div class="bg-primary text-white p-2 rounded me-2 fw-bold">CC</div>
        <span class="sidebar-title h5 mb-0" *ngIf="!sidebarCollapsed">Campus Connect</span>
      </div>
    </div>

    <!-- Navigation -->
    <div class="sidebar-nav flex-grow-1 py-3">
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link active text-white d-flex align-items-center px-3 py-2">
            <i class="bi bi-speedometer2 me-3"></i>
            <span *ngIf="!sidebarCollapsed">Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light d-flex align-items-center px-3 py-2" style="cursor: pointer;">
            <i class="bi bi-people me-3"></i>
            <span *ngIf="!sidebarCollapsed">Usuarios</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light d-flex align-items-center px-3 py-2" style="cursor: pointer;">
            <i class="bi bi-book me-3"></i>
            <span *ngIf="!sidebarCollapsed">Cursos</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light d-flex align-items-center px-3 py-2" style="cursor: pointer;">
            <i class="bi bi-mortarboard me-3"></i>
            <span *ngIf="!sidebarCollapsed">Asignaturas</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light d-flex align-items-center px-3 py-2" style="cursor: pointer;">
            <i class="bi bi-bar-chart me-3"></i>
            <span *ngIf="!sidebarCollapsed">Reportes</span>
          </a>
        </li>
      </ul>

      <!-- Profile Section -->
      <div class="mt-4 px-3" *ngIf="!sidebarCollapsed">
        <h6 class="text-muted small">Mi Cuenta</h6>
        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link text-light d-flex align-items-center px-3 py-2" 
               style="cursor: pointer;" (click)="goToProfile()">
              <i class="bi bi-person me-3"></i>
              <span>Perfil</span>
            </a>
          </li>
        </ul>
      </div>
    </div>

    <!-- User Info -->
    <div class="sidebar-footer p-3 border-top border-secondary" *ngIf="!sidebarCollapsed && user">
      <div class="d-flex align-items-center">
        <div class="bg-secondary rounded-circle d-flex align-items-center justify-content-center me-3" 
             style="width: 40px; height: 40px;">
          <i class="bi bi-person text-white"></i>
        </div>
        <div class="flex-grow-1">
          <div class="fw-bold small">{{ user.id }}</div>
          <div class="text-muted small">{{ user.email }}</div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="flex-grow-1 d-flex flex-column">
    <!-- Header -->
    <header class="bg-white border-bottom p-3">
      <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
          <button class="btn btn-outline-secondary me-3" (click)="toggleSidebar()">
            <i class="bi bi-list"></i>
          </button>
        </div>

        <div class="dropdown">
          <button class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center" 
                  type="button" data-bs-toggle="dropdown">
            <div class="bg-secondary rounded-circle d-flex align-items-center justify-content-center me-2" 
                 style="width: 32px; height: 32px;">
              <i class="bi bi-person text-white"></i>
            </div>
            <span>{{user?.id}}</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" (click)="goToProfile()">
              <i class="bi bi-person me-2"></i>Perfil
            </a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" (click)="logout()">
              <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
            </a></li>
          </ul>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow-1 p-4 bg-light">
      <div class="container-fluid">
        <div class="mb-4">
          <h1 class="h2 mb-1">Panel de Administración</h1>
          <p class="text-muted">Bienvenido al panel de administración de Campus Connect.</p>
        </div>

        <!-- Admin Modules Grid -->
        <div class="row g-4">
          <div class="col-md-6 col-lg-4" *ngFor="let module of adminModules">
            <div class="card h-100 shadow-sm module-card" 
                 style="cursor: pointer;" 
                 (click)="navigateToModule(module.route)">
              <div class="card-body text-center text-white {{ module.bgColor }} d-flex flex-column">
                <div class="mb-3">
                  <div class="bg-white bg-opacity-25 rounded-circle d-inline-flex align-items-center justify-content-center" 
                       style="width: 60px; height: 60px;">
                    <i class="{{ module.icon }} fs-2"></i>
                  </div>
                </div>
                <h5 class="card-title mb-2">{{ module.title }}</h5>
                <p class="card-text mb-3 flex-grow-1">{{ module.description }}</p>
                <button class="btn btn-light btn-sm mt-auto">
                  Ingresar
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
</div>
