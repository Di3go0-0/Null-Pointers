<div class="main-content">
  <div class="content-header">
    <button class="back-button" (click)="goBack()">
      <i class="material-icons">arrow_back</i>
      Volver
    </button>
  </div>

  <div class="form-container">
    <form class="subject-form" (ngSubmit)="guardarCambios()">
      <h2 style="text-align: center; margin-bottom: 2rem;">Edición de notas por estudiante</h2>

      <div *ngFor="let nota of notas" class="form-group">
        <label><strong>Estudiante:</strong> {{ getStudentName(nota.studentId) }}</label>

        <div class="form-row">
          <div class="form-group">
            <label>Nota 1</label>
            <input type="number" min="0" max="5" step="0.1" [(ngModel)]="nota.term1_grade" name="term1_{{ nota.id }}"
              (ngModelChange)="calcularFinal(nota)" [class.invalid]="!esNotaValida(nota.term1_grade)" />
            <div *ngIf="!esNotaValida(nota.term1_grade)" class="error-message">Nota inválida</div>
          </div>

          <div class="form-group">
            <label>Nota 2</label>
            <input type="number" min="0" max="5" step="0.1" [(ngModel)]="nota.term2_grade" name="term2_{{ nota.id }}"
              (ngModelChange)="calcularFinal(nota)" [class.invalid]="!esNotaValida(nota.term2_grade)" />
            <div *ngIf="!esNotaValida(nota.term2_grade)" class="error-message">Nota inválida</div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Nota 3</label>
            <input type="number" min="0" max="5" step="0.1" [(ngModel)]="nota.term3_grade" name="term3_{{ nota.id }}"
              (ngModelChange)="calcularFinal(nota)" [class.invalid]="!esNotaValida(nota.term3_grade)" />
            <div *ngIf="!esNotaValida(nota.term3_grade)" class="error-message">Nota inválida</div>
          </div>

          <div class="form-group">
            <label>Final (automática)</label>
            <input type="text" [value]="nota.final" disabled />
          </div>
        </div>

        <hr style="margin: 2rem 0;" />
      </div>
      <div class="loading-container" *ngIf="!hayNotas">
        <div class="spinner"></div>
        <p>Cargando notas...</p>
      </div>

      <div class="empty-state" *ngIf="!hayNotas && notas.length === 0">
        <i class="material-icons">school</i>
        <h3>No se encontraron Estudiantes matriculados</h3>
      </div>

      <div class="form-actions">
        <button type="button" class="cancel-button" (click)="goBack()">
          <i class="material-icons">close</i>
          Cancelar
        </button>
        <button type="submit" class="submit-button" [disabled]="tieneErrores()">
          <i class="material-icons">save</i>
          Guardar cambios
        </button>
      </div>
    </form>
  </div>
</div>
