<div class="min-vh-100 d-flex flex-column">
  <!-- Header -->
  <header class="bg-dark py-3 px-4">
    <div class="container">
      <div class="d-flex align-items-center">
        <div class="bg-primary text-white p-2 rounded me-2 fw-bold">CC</div>
        <span class="text-white h4 mb-0">Campus Connect</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center p-4"
    style="background: rgba(2, 150, 155, 0.575)">

    <!-- Login Form -->
    <div class="card shadow-lg" style="width: 100%; max-width: 400px;">
      <!-- encabezado login -->
      <div class="card-header text-center">
        <h2 class="card-title mb-1">Inicio de Sesión</h2>
        <p class="text-muted">Ingresa tus credenciales para acceder</p>
      </div>
      <!-- formulario de inicio de sesion -->
      <div class="card-body">
        <form #loginForm="ngForm">
          <!-- correo -->
          <div class="mb-3">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="email" [(ngModel)]="email" name="email"
              placeholder="digita tu correo" required />
          </div>
          <!-- contraseña -->
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input placeholder="digita tu contraseña" type="password" class="form-control" id="password"
              [(ngModel)]="password" name="password" required>
          </div>

          <button type="submit" class="btn btn-primary w-100" (click)="validarDatos()">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
            {{ isLoading ? 'Iniciando...' : 'Ingresar' }}
          </button>
        </form>

        <!-- contraseña olvidada -->
        <div class="text-center mt-3">
          <a routerLink="/forgot-password" class="btn btn-warning text-decoration-none">
            ¿Olvidaste tu contraseña?
          </a>
        </div>
      </div>

      <!-- acceso al chatbot -->
      <div class="card-footer text-center">
        <a routerLink="/chatbot" class="btn btn-outline-primary text-dark">
          <i class="bi bi-question-circle me-2"></i>
          Preguntas Frecuentes
        </a>
      </div>

    </div>
  </main>
</div>
