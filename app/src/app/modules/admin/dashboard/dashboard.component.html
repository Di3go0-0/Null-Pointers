<!-- Main Content Area -->
    <main class="flex-grow-1 p-4 bg-light">
      <div class="container-fluid">
        <div class="mb-4">
          <h1 class="h2 mb-1">Panel de Administración</h1>
          <p class="text-muted">Bienvenido al panel de administración de Campus Connect.</p>
        </div>

        <!-- Admin Modules Grid -->
        <div class="row g-4">
          @for (module of adminModules; track module) {
          <div class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm module-card" style="cursor: pointer;"
              (click)="navigateToModule(module.route)">
              <div class="card-body text-center text-white {{ module.bgColor }} d-flex flex-column">
                <div class="mb-3">
                  <div
                    class="bg-white bg-opacity-25 rounded-circle d-inline-flex align-items-center justify-content-center"
                    style="width: 60px; height: 60px;">
                    <i class="{{ module.icon }} fs-2"></i>
                  </div>
                </div>
                <h5 class="card-title mb-2">{{ module.title }}</h5>
                <p class="card-text mb-3 flex-grow-1">{{ module.description }}</p>
                <button class="btn btn-light btn-sm mt-auto">
                  Ingresar
                </button>
              </div>
            </div>
          </div>
          }

        </div>
      </div>
    </main>
