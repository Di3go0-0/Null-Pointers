<main class="main-content">
    <div class="content-header">
        <button class="back-button" (click)="cancel()">
            <i class="material-icons">arrow_back</i>
            <span>{{ isEditing ? 'Modificar asignatura' : 'Nueva asignatura' }}</span>
        </button>
    </div>

    <div class="form-container" *ngIf="materia">
        <form (ngSubmit)="onSubmit()" class="subject-form">

            <div class="form-group">
                <label for="name">Nombre de la asignatura*</label>
                <input type="text" id="name" [(ngModel)]="materia.courseName" name="name" required minlength="3">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="code">Código*</label>
                    <input type="text" id="code" [(ngModel)]="materia.courseCode" name="code" required
                        pattern="[A-Z]{2,5}[0-9]{2,4}">
                </div>

                <div class="form-group">
                    <label for="credits">Duracion del curso en horas*</label>
                    <input type="number" id="credits" [(ngModel)]="materia.durationHours" name="credits" required min="1">
                </div>
            </div>

            <div class="form-group">
                <label for="description">Descripción*</label>
                <textarea id="description" [(ngModel)]="materia.description" name="description" required minlength="10"
                    rows="4"></textarea>
            </div>


            <div class="form-group">
                <label for="program">Programa Académico*</label>
                <select id="program" [(ngModel)]="materia.programId" name="programId" required>
                    <option value="">Seleccione un programa</option>
                    <option *ngFor="let p of programas" [value]="p.id">{{ p.programName }}</option>
                </select>
            </div>


            <div class="form-actions">
                <button type="button" class="cancel-button" (click)="cancel()">
                    <i class="material-icons">close</i> Cancelar
                </button>

                <button type="submit" class="submit-button" [disabled]="isLoading">
                    <span *ngIf="!isLoading">
                        <i class="material-icons">save</i>
                        {{ isEditing ? 'Guardar' : 'Crear' }}
                    </span>
                    <div class="spinner" *ngIf="isLoading"></div>
                </button>
            </div>
        </form>
    </div>

    <div *ngIf="!materia && isLoading">Cargando datos...</div>
</main>
