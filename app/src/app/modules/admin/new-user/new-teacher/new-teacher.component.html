<main class="main-content">
  <div class="content-header">
    <button class="back-button" (click)="cancel()">
      <i class="material-icons">arrow_back</i>
      <span>Nuevo Docente</span>
    </button>
  </div>

  <form #form="ngForm" (ngSubmit)="onSubmit()" class="subject-form">
    <h3>Información Profesional</h3>
    <div class="form-group">
      <label>Nombre*</label>
      <input type="text" [(ngModel)]="teacher.name" name="name" required>
    </div>

    <div class="form-group">
      <label>Email*</label>
      <input type="email" [(ngModel)]="teacher.email" name="email" required>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Contraseña*</label>
        <input type="password" [(ngModel)]="teacher.password" name="password" required>
      </div>
      <div class="form-group">
        <label>Confirmar contraseña*</label>
        <input type="password" [(ngModel)]="teacher.confirmPassword" name="confirmPassword" required>
      </div>
    </div>

    <div class="form-group">
      <label>Especialidad*</label>
      <input type="text" [(ngModel)]="teacher.specialty" name="specialty" required>
    </div>

    <div class="form-group">
      <label>Experiencia*</label>
      <textarea [(ngModel)]="teacher.experience" name="experience" rows="3" required></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Salario base*</label>
        <input type="number" [(ngModel)]="teacher.baseSalary" name="baseSalary" required min="0">
      </div>

      <div class="form-group">
        <label>Tipo de contrato*</label>
        <select [(ngModel)]="teacher.contractTypeId" name="contractTypeId" required>
          <option value="">Seleccione un tipo</option>
          <option *ngFor="let tipo of tiposContrato" [value]="tipo.id">
            {{ tipo.typeName }}
          </option>
        </select>
      </div>
    </div>

    <hr>

    <h3>Información Personal</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Número de identificación*</label>
        <input type="text" [(ngModel)]="personalInfo.identificationNumber" name="identificationNumber" required>
      </div>

      <div class="form-group">
        <label>Fecha de nacimiento*</label>
        <input type="date" [(ngModel)]="personalInfo.birthdate" name="birthdate" required>
      </div>
    </div>

    <div class="form-group">
      <label>Dirección*</label>
      <input type="text" [(ngModel)]="personalInfo.address" name="address" required>
    </div>

    <div class="form-group">
      <label>Teléfono*</label>
      <input type="text" [(ngModel)]="personalInfo.phoneNumber" name="phoneNumber" required>
    </div>

    <div class="form-actions">
      <button type="button" class="cancel-button" (click)="cancel()">
        <i class="material-icons">close</i> Cancelar
      </button>

      <button type="submit" class="submit-button" [disabled]="isLoading">
        <span *ngIf="!isLoading"><i class="material-icons">save</i> Registrar</span>
        <div class="spinner" *ngIf="isLoading"></div>
      </button>
    </div>
  </form>
</main>
