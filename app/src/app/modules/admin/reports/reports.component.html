<main class="flex-grow-1 bg-dark text-white min-vh-100">
    <div class="container py-5">
        <!-- Title -->
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold">Gestionar Reportes</h1>
        </div>

        <!-- Report Categories - Single Column -->
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="d-flex flex-column gap-4">

                    <!-- Estudiantes Matriculados -->
                    <div class="card report-card bg-primary">
                        <div class="card-body d-flex align-items-center text-white">
                            <div class="me-3">
                                <i class="bi bi-people-fill fs-1"></i>
                            </div>
                            <div class="flex-grow-1">
                                <h5 class="card-title mb-1">Estudiantes Matriculados</h5>
                                <p class="card-text small opacity-90">Descargar reporte de estudiantes registrados</p>
                            </div>

                            <div>
                                <span *ngIf="isGeneratingStudentsReport"
                                    class="spinner-border spinner-border-sm me-2"></span>
                                <button (click)="descargarPDFEstudiantesMatriculados()" class="btn btn-dark">
                                    <i class="bi bi-download fs-4" *ngIf="!isGeneratingStudentsReport"></i>
                                </button>

                            </div>
                        </div>
                    </div>

                    <!-- Docentes -->
                    <div class="card report-card bg-purple">
                        <div class="card-body d-flex align-items-center text-white">
                            <div class="me-3">
                                <i class="bi bi-person-badge-fill fs-1"></i>
                            </div>
                            <div class="flex-grow-1">
                                <h5 class="card-title mb-1">Docentes</h5>
                                <p class="card-text small opacity-90">Descargar reporte del personal docente</p>
                            </div>
                            <div>
                                <span *ngIf="isGeneratingTeachersReport"
                                    class="spinner-border spinner-border-sm me-2"></span>
                                <button (click)="descargarPDFDocentes()" class="btn btn-dark">
                                    <i class="bi bi-download fs-4" *ngIf="!isGeneratingStudentsReport"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Inscritos en Cursos de Extensión -->
                    <div class="card report-card bg-warning">
                        <div class="card-body d-flex align-items-center text-white">
                            <div class="me-3">
                                <i class="bi bi-journal-bookmark-fill fs-1 text-dark"></i>
                            </div>
                            <div class="flex-grow-1">
                                <h5 class="card-title mb-1 text-dark">Inscritos en Cursos de Extensión</h5>
                                <p class="card-text small opacity-90 text-dark">Ver cursos de extensión disponibles</p>
                            </div>
                            <div>
                                <span *ngIf="isGeneratingTeachersReport"
                                    class="spinner-border spinner-border-sm me-2"></span>
                                <button (click)="generateInscritosExtensionPDF()" class="btn btn-dark">
                                    <i class="bi bi-download fs-4" *ngIf="!isGeneratingStudentsReport"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>
