<main class="main-content">
    <div class="content-header">
        <button class="back-button" (click)="cancel()">
            <i class="material-icons">arrow_back</i>
            <span>Nuevo Horario</span>
        </button>
    </div>

    <div class="form-container">
        <form #form="ngForm" (ngSubmit)="onSubmit()" class="subject-form">

            <div class="form-group">
                <label for="day">Día*</label>
                <select id="day" [(ngModel)]="horario.day" name="day" required>
                    <option value="">Seleccione un día</option>
                    <option *ngFor="let dia of dias" [value]="dia.value">{{ dia.label }}</option>
                </select>
            </div>

            <div class="form-group">
                <label for="startTime">Hora de inicio*</label>
                <select id="startTime" [(ngModel)]="startTimeStr" name="startTimeStr" required>
                    <option *ngFor="let h of horas" [value]="h.value">{{ h.label }}</option>
                </select>
            </div>

            <div class="form-group">
                <label for="endTime">Hora de fin*</label>
                <select id="endTime" [(ngModel)]="endTimeStr" name="endTimeStr" required>
                    <option *ngFor="let h of horas" [value]="h.value">{{ h.label }}</option>
                </select>
            </div>

            <div class="form-group">
                <label for="classroom">Salón*</label>
                <input type="text" id="classroom" [(ngModel)]="horario.classroom" name="classroom" required>
            </div>

            <div class="form-actions">
                <button type="button" class="cancel-button" (click)="cancel()">
                    <i class="material-icons">close</i> Cancelar
                </button>

                <button type="submit" class="submit-button" [disabled]="form.invalid || isLoading">
                    <span *ngIf="!isLoading"><i class="material-icons">save</i> Crear</span>
                    <div class="spinner" *ngIf="isLoading"></div>
                </button>
            </div>

        </form>
    </div>
</main>
