<div class="d-flex min-vh-100">
  <!-- Sidebar -->
  <nav class="sidebar bg-dark text-white" [class.collapsed]="sidebarCollapsed">
    <!-- Logo -->
    <div class="sidebar-header p-3 border-bottom border-secondary">
      <div class="d-flex align-items-center">
        <div class="bg-primary text-white p-2 rounded me-2 fw-bold">CC</div>
        <span class="sidebar-title h5 mb-0" *ngIf="!sidebarCollapsed">Campus Connect</span>
      </div>
    </div>

    <!-- Navigation -->
    <div class="sidebar-nav flex-grow-1 py-3">
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link text-white" [routerLink]="['/admin']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">
            <i class="bi bi-speedometer2 me-3"></i>
            <span *ngIf="!sidebarCollapsed">Dashboard</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-white" [routerLink]="['/admin/users']" routerLinkActive="active">
            <i class="bi bi-people me-3"></i>
            <span *ngIf="!sidebarCollapsed">Usuarios</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-white" [routerLink]="['/admin/courses']" routerLinkActive="active">
            <i class="bi bi-book me-3"></i>
            <span *ngIf="!sidebarCollapsed">Cursos</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-white" [routerLink]="['/admin/asignatures']" routerLinkActive="active">
            <i class="bi bi-mortarboard me-3"></i>
            <span *ngIf="!sidebarCollapsed">Asignaturas</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-white" [routerLink]="['/admin/reports']" routerLinkActive="active">
            <i class="bi bi-bar-chart me-3"></i>
            <span *ngIf="!sidebarCollapsed">Reportes</span>
          </a>
        </li>
      </ul>

      <!-- Profile Section -->
      <div class="mt-4 px-3" *ngIf="!sidebarCollapsed">
        <h6 class="text-light small">Mi Cuenta</h6>
        <ul class="nav flex-column">
          <li class="nav-item">
            <a style="cursor: pointer;" class="nav-link text-light d-flex align-items-center px-3 py-2" (click)="goToProfile()">
              <i class="bi bi-person me-3"></i>
              <span>Perfil</span>
            </a>
          </li>
        </ul>
      </div>
    </div>

    <!-- User Info -->
    <div class="sidebar-footer p-3 border-top border-secondary" *ngIf="!sidebarCollapsed && user">
      <div class="d-flex align-items-center">
        <div class="bg-secondary rounded-circle d-flex align-items-center justify-content-center me-3"
          style="width: 40px; height: 40px;">
          <i class="bi bi-person text-white"></i>
        </div>
        <div class="flex-grow-1">
          <div class="fw-bold small">{{ user.name }}</div>
          <div class="text-white small">{{ user.email }}</div>
        </div>
      </div>
    </div>
  </nav>


  <!-- Main Content -->
  <div class="flex-grow-1 d-flex flex-column">
    <!-- Header -->
    <header class="bg-white border-bottom p-3">
      <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
          <button class="btn btn-outline-secondary me-3" (click)="toggleSidebar()">
            <i class="bi bi-list"></i>
          </button>
        </div>

        <div class="dropdown">
          <button class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center" type="button"
            data-bs-toggle="dropdown">
            <div class="bg-secondary rounded-circle d-flex align-items-center justify-content-center me-2"
              style="width: 32px; height: 32px;">
              <i class="bi bi-person text-white"></i>
            </div>
            <span>{{user?.name}}</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" style="cursor: pointer;" (click)="goToProfile()">
                <i class="bi bi-person me-2"></i>Perfil
              </a></li>
            <li>
              <hr class="dropdown-divider">
            </li>
            <li><a class="dropdown-item text-danger" style="cursor: pointer;" (click)="logout()">
                <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
              </a></li>
          </ul>
        </div>
      </div>
    </header>
    <router-outlet />

  </div>
