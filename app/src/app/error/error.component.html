<div class="container error-page d-flex flex-column justify-content-center align-items-center text-center">
    <div class="card shadow p-5" style="max-width: 600px;">
        <div class="card-body">
            <h1 class="display-1 text-danger mb-4">
                <i class="material-icons" style="font-size: 80px;">error_outline</i>
                404
            </h1>
            <h3 class="mb-3">Página no encontrada</h3>
            <p class="text-muted mb-4">
                Lo sentimos, no pudimos encontrar el recurso que estás buscando.
            </p>
            <button (click)="goBack()" class="btn btn-outline-dark btn-lg">
                <i class="material-icons align-middle">arrow_back</i> Volver
            </button>
        </div>
    </div>
</div>
